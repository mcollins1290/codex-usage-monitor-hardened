[package]
name = "codex-usage-hardened"
version = "1.11.0"
edition = "2021"
license = "MIT"
description = "Codex Usage Hardened"
homepage = "https://github.com/mcollins1290/codex-usage-monitor-hardened"
repository = "https://github.com/mcollins1290/codex-usage-monitor-hardened"

[package.metadata.winres]
CompanyName = "Ray"
ProductName = "Codex Usage Hardened"
FileDescription = "Lightweight Codex usage monitor for Windows"
OriginalFilename = "codex-usage-hardened.exe"
InternalName = "CodexUsageHardened"
Comments = "Derived from Claude Code Usage Monitor under the MIT License"
LegalCopyright = "Original copyright (C) 2026 Code Zeno Pty Ltd; modifications (C) 2026 Ray"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.10"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
